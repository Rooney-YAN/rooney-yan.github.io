<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">APAC Quant Trading Hackathon 比赛过程示意</title>
  <desc id="desc">初期收益为负；中段排名一度达到第二或第三；最终在市场下跌后获得香港第七。节点只表示先后顺序，不代表真实收益曲线。</desc>
  <rect width="960" height="300" fill="#f0ece5"/>
  <text x="50" y="46" fill="#716b63" font-family="Inter, Noto Sans SC, sans-serif" font-size="14" letter-spacing="2">比赛过程 · THREE MOMENTS</text>
  <path d="M150 124 H810" fill="none" stroke="#cfc7bc" stroke-width="2"/>
  <path d="m802 118 8 6-8 6" fill="none" stroke="#cfc7bc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Inter, Noto Sans SC, sans-serif">
    <circle cx="150" cy="124" r="11" fill="#b95738"/>
    <text x="150" y="91" text-anchor="middle" fill="#716b63" font-size="14">01 · 初期</text>
    <text x="150" y="175" text-anchor="middle" fill="#2f2d29" font-size="25" font-weight="600">收益为负</text>
    <text x="150" y="209" text-anchor="middle" fill="#716b63" font-size="14">开始怀疑策略</text>

    <circle cx="480" cy="124" r="11" fill="#b95738"/>
    <text x="480" y="91" text-anchor="middle" fill="#716b63" font-size="14">02 · 中段</text>
    <text x="480" y="175" text-anchor="middle" fill="#2f2d29" font-size="25" font-weight="600">一度第 2 / 3</text>
    <text x="480" y="209" text-anchor="middle" fill="#716b63" font-size="14">多头策略冲榜</text>

    <circle cx="810" cy="124" r="11" fill="#b95738"/>
    <text x="810" y="91" text-anchor="middle" fill="#716b63" font-size="14">03 · 最终</text>
    <text x="810" y="175" text-anchor="middle" fill="#2f2d29" font-size="25" font-weight="600">香港第 7</text>
    <text x="810" y="209" text-anchor="middle" fill="#716b63" font-size="14">市场下跌，收益回吐</text>
  </g>
  <text x="50" y="267" fill="#918b82" font-family="Inter, Noto Sans SC, sans-serif" font-size="12">节点概览 · 非实际净值或排名曲线</text>
</svg>
